<!doctype html>
<meta charset="utf-8" />
<title>Vector Tools 3D WebGL2 benchmark</title>
<canvas id="c" width="1280" height="800"></canvas>
<pre id="out">running</pre>
<script>
  (async () => {
    const canvas = document.getElementById("c");
    const out = document.getElementById("out");
    const gl = canvas.getContext("webgl2", {
      antialias: false,
      alpha: false,
      premultipliedAlpha: false,
    });
    if (!gl) {
      out.textContent = JSON.stringify({ error: "no webgl2" });
      return;
    }
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    const info = {
      vendor: dbg
        ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)
        : gl.getParameter(gl.VENDOR),
      renderer: dbg
        ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
        : gl.getParameter(gl.RENDERER),
      version: gl.getParameter(gl.VERSION),
      shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
      extColorBufferFloat: !!gl.getExtension("EXT_color_buffer_float"),
      timerQuery: !!gl.getExtension("EXT_disjoint_timer_query_webgl2"),
    };

    function shader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    function program(vs, fs, varyings) {
      const p = gl.createProgram();
      gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
      if (varyings)
        gl.transformFeedbackVaryings(p, varyings, gl.INTERLEAVED_ATTRIBS);
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        throw new Error(gl.getProgramInfoLog(p));
      return p;
    }
    const common = `
vec3 samplePos(int i, int n){
  int side = int(ceil(pow(float(n),1.0/3.0)));
  int ix=i%side, iy=(i/side)%side, iz=i/(side*side);
  vec3 q=(vec3(float(ix),float(iy),float(iz))/max(float(side-1),1.0))*2.0-1.0;
  return q*0.86;
}
vec3 field(vec3 p){
  // Dipole-like but finite enough for a benchmark.
  vec3 a=p-vec3(-0.35,0.0,0.0), b=p-vec3(0.35,0.0,0.0);
  return a/(pow(dot(a,a)+0.03,1.5))-b/(pow(dot(b,b)+0.03,1.5));
}
mat3 basisFromDir(vec3 d){
  vec3 z=normalize(d); vec3 h=abs(z.z)<0.9?vec3(0,0,1):vec3(0,1,0);
  vec3 x=normalize(cross(h,z)); vec3 y=cross(z,x); return mat3(x,y,z);
}
`;
    const vsLine = `#version 300 es\nprecision highp float; uniform int u_n; ${common}
void main(){int i=gl_InstanceID; vec3 p=samplePos(i,u_n); vec3 v=field(p); vec3 d=normalize(v); float L=0.07; vec3 q=p+d*L*float(gl_VertexID); gl_Position=vec4(q,1.0);}`;
    const vsBill = `#version 300 es\nprecision highp float; uniform int u_n; out vec3 v_n; ${common}
void main(){
  int i=gl_InstanceID, vid=gl_VertexID; vec3 p=samplePos(i,u_n); vec3 d=normalize(field(p)); float L=0.07; float w=0.009, hw=0.021, hs=0.026;
  vec3 view=normalize(vec3(0.3,0.2,1.0)); vec3 side=cross(d,view); if(dot(side,side)<1e-8) side=cross(d,vec3(0,1,0)); side=normalize(side);
  vec3 q;
  if(vid<6){int k=vid; float z=(k==0||k==3||k==5)?0.0:L-hs; float s=(k==0||k==1||k==3)?-1.0:1.0; if(k==2||k==5)s=1.0; q=p+d*z+side*w*s;}
  else {int k=vid-6; if(k==0) q=p+d*L; else q=p+d*(L-hs)+side*hw*(k==1?-1.0:1.0);}
  v_n=normalize(cross(side,d)); gl_Position=vec4(q,1.0);
}`;
    const vsSolid = `#version 300 es\nprecision highp float; uniform int u_n; out vec3 v_n; ${common}
const int SIDES=8;
void main(){
  int i=gl_InstanceID, id=gl_VertexID; vec3 p=samplePos(i,u_n); vec3 f=field(p); vec3 d=normalize(f); mat3 B=basisFromDir(d);
  float L=0.07, shaftL=0.045, r=0.0045, hr=0.011; vec3 local; vec3 nrm;
  if(id<48){
    int tri=id/3, corner=id%3, seg=tri/2, halfIdx=tri%2; float a0=6.28318530718*float(seg)/8.0, a1=6.28318530718*float(seg+1)/8.0;
    vec2 c0=vec2(cos(a0),sin(a0)), c1=vec2(cos(a1),sin(a1));
    vec2 c; float z;
    if(halfIdx==0){ if(corner==0){c=c0;z=0.0;} else if(corner==1){c=c1;z=0.0;} else {c=c1;z=shaftL;} }
    else { if(corner==0){c=c0;z=0.0;} else if(corner==1){c=c1;z=shaftL;} else {c=c0;z=shaftL;} }
    local=vec3(c*r,z); nrm=normalize(vec3(c,0.0));
  } else {
    int j=id-48, seg=j/3, corner=j%3; float a0=6.28318530718*float(seg)/8.0, a1=6.28318530718*float(seg+1)/8.0; vec2 c0=vec2(cos(a0),sin(a0)), c1=vec2(cos(a1),sin(a1));
    if(corner==0) local=vec3(c0*hr,shaftL); else if(corner==1) local=vec3(c1*hr,shaftL); else local=vec3(0.0,0.0,L);
    vec3 e1=vec3((c1-c0)*hr,0.0), e2=vec3(-c0*hr,L-shaftL); nrm=normalize(cross(e1,e2));
  }
  vec3 q=p+B*local; v_n=normalize(B*nrm); gl_Position=vec4(q,1.0);
}`;
    const fsFlat = `#version 300 es\nprecision highp float; out vec4 o; void main(){o=vec4(0.2,0.75,1.0,1.0);}`;
    const fsLit = `#version 300 es\nprecision highp float; in vec3 v_n; out vec4 o; void main(){float l=0.25+0.75*abs(dot(normalize(v_n),normalize(vec3(.4,.7,1.0)))); o=vec4(vec3(0.2,0.75,1.0)*l,1.0);}`;
    const progs = {
      line: program(vsLine, fsFlat),
      billboard: program(vsBill, fsLit),
      solid: program(vsSolid, fsLit),
    };
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.viewport(0, 0, canvas.width, canvas.height);

    async function drawBench(name, verts, prim, n) {
      const p = progs[name];
      gl.useProgram(p);
      gl.uniform1i(gl.getUniformLocation(p, "u_n"), n);
      for (let i = 0; i < 1; i++) gl.drawArraysInstanced(prim, 0, verts, n);
      gl.finish();
      const samples = [];
      for (let k = 0; k < 3; k++) {
        const t0 = performance.now();
        for (let i = 0; i < 1; i++) gl.drawArraysInstanced(prim, 0, verts, n);
        gl.finish();
        samples.push(performance.now() - t0);
      }
      samples.sort((a, b) => a - b);
      return {
        median_ms: samples[1],
        min_ms: samples[0],
        max_ms: samples[2],
        vertices_per_arrow: verts,
        total_vertices: verts * n,
      };
    }

    // Float-texture ping-pong RK4-like update: state.xyz + age, one fragment per particle.
    const updVS = `#version 300 es\nprecision highp float; const vec2 P[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3)); void main(){gl_Position=vec4(P[gl_VertexID],0,1);}`;
    const updFS = `#version 300 es\nprecision highp float; uniform sampler2D s; uniform int res; out vec4 o; vec3 F(vec3 p){return vec3(-p.y,p.x,0.25*sin(3.0*p.x));} void main(){ivec2 q=ivec2(gl_FragCoord.xy); vec4 a=texelFetch(s,q,0); vec3 p=a.xyz; float h=.004; vec3 k1=F(p),k2=F(p+.5*h*k1),k3=F(p+.5*h*k2),k4=F(p+h*k3); p+=h*(k1+2.0*k2+2.0*k3+k4)/6.0; o=vec4(p,a.w+1.0);}`;
    const updP = program(updVS, updFS);
    const fb = gl.createFramebuffer();
    function tex(res) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, res, res);
      return t;
    }
    async function particleBench(count) {
      const res = Math.ceil(Math.sqrt(count));
      const a = tex(res),
        b = tex(res);
      let read = a,
        write = b;
      gl.useProgram(updP);
      gl.uniform1i(gl.getUniformLocation(updP, "s"), 0);
      gl.uniform1i(gl.getUniformLocation(updP, "res"), res);
      gl.bindVertexArray(vao);
      const samples = [];
      for (let warm = 0; warm < 1; warm++) {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, read);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(
          gl.FRAMEBUFFER,
          gl.COLOR_ATTACHMENT0,
          gl.TEXTURE_2D,
          write,
          0
        );
        gl.viewport(0, 0, res, res);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        [read, write] = [write, read];
      }
      gl.finish();
      for (let k = 0; k < 3; k++) {
        const t0 = performance.now();
        for (let j = 0; j < 1; j++) {
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, read);
          gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_2D,
            write,
            0
          );
          gl.viewport(0, 0, res, res);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          [read, write] = [write, read];
        }
        gl.finish();
        samples.push(performance.now() - t0);
      }
      samples.sort((x, y) => x - y);
      return {
        resolution: res,
        texels: res * res,
        median_ms: samples[1],
        min_ms: samples[0],
        max_ms: samples[2],
      };
    }

    const results = { info, glyphs: {}, particles: {} };
    for (const n of [1000, 8000]) {
      results.glyphs[n] = {
        line: await drawBench("line", 2, gl.LINES, n),
        billboard: await drawBench("billboard", 9, gl.TRIANGLES, n),
        solid: await drawBench("solid", 72, gl.TRIANGLES, n),
      };
    }
    if (info.extColorBufferFloat) {
      for (const n of [16000, 64000])
        results.particles[n] = await particleBench(n);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.04, 0.04, 0.06, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(progs.solid);
    gl.uniform1i(gl.getUniformLocation(progs.solid, "u_n"), 1000);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 72, 1000);
    out.textContent = JSON.stringify(results, null, 2);
    document.title = "DONE";
  })();
</script>
